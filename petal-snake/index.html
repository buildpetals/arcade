<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Petal Snake · Build Petals Arcade</title>
<meta name="description" content="Grow your brick vine, pick pixel flowers, and clear all 10 levels.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#101a42; --navy2:#17245a; --grid:rgba(143,199,255,.10);
    --lav:#b9a7f5; --lav2:#8f7ae6; --sky:#8fc7ff; --cream:#fff6e5; --gold:#ffd166;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--navy);color:var(--cream);
    font-family:"Fredoka",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
  body{background:
      linear-gradient(var(--grid) 1px,transparent 1px) 0 0/24px 24px,
      linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/24px 24px,
      radial-gradient(ellipse at top,var(--navy2),var(--navy) 70%);
    display:flex;flex-direction:column;align-items:center}
  #app{width:100%;height:100%;max-width:640px;display:flex;flex-direction:column;align-items:center;padding:10px 10px 12px;gap:8px}
  header{width:100%;display:flex;align-items:center;justify-content:space-between;gap:6px}
  .title{font-family:"Press Start 2P",monospace;font-size:clamp(11px,3.4vw,16px);line-height:1.2}
  .title span{color:var(--lav)}
  .row{display:flex;gap:6px;align-items:center}
  .pill{background:rgba(255,246,229,.08);border:2px dashed rgba(185,167,245,.55);border-radius:999px;
    padding:4px 9px;font-weight:600;font-size:clamp(11px,3vw,14px);white-space:nowrap}
  .pill b{color:var(--gold)}
  .iconbtn{background:var(--lav);color:var(--navy);border:0;border-radius:10px;width:32px;height:32px;
    font-size:15px;cursor:pointer;box-shadow:0 3px 0 var(--lav2);flex:none}
  .iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--lav2)}
  #bar{width:100%;height:8px;border-radius:99px;background:rgba(185,167,245,.18);overflow:hidden;flex:none}
  #bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lav),var(--gold));transition:width .2s}
  #stage{position:relative;flex:1;width:100%;min-height:0;display:flex;align-items:center;justify-content:center}
  canvas#c{display:block;border-radius:14px;box-shadow:0 0 0 3px rgba(185,167,245,.6),0 12px 30px rgba(0,0,0,.35);touch-action:none;image-rendering:pixelated}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px}
  .card{background:var(--cream);color:var(--navy);border-radius:18px;padding:18px 18px 16px;width:min(94%,390px);
    text-align:center;box-shadow:0 6px 0 var(--lav2),0 18px 40px rgba(0,0,0,.4);position:relative;max-height:100%;overflow:auto}
  .card h1{margin:4px 0 8px;font:400 20px/1.3 "Press Start 2P",monospace}
  .card h1 span{color:var(--lav2)}
  .card p{margin:6px 0;font-size:15px;line-height:1.35;font-weight:500}
  .legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:10px 0 4px}
  .legend div{display:flex;align-items:center;gap:4px;background:#fff;border:2px dashed #d9cff8;border-radius:10px;padding:3px 7px 3px 3px;font-size:12px;font-weight:600}
  .legend canvas{image-rendering:pixelated}
  .btn{display:inline-block;background:var(--lav);color:var(--navy);border:0;border-radius:12px;padding:11px 20px;
    font:700 17px "Fredoka",sans-serif;cursor:pointer;box-shadow:0 4px 0 var(--lav2);text-decoration:none;margin:6px 4px 2px}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lav2)}
  .btn.alt{background:var(--sky);box-shadow:0 4px 0 #5c9be0}
  .btn.ghost{background:transparent;box-shadow:none;border:2px dashed var(--lav2);padding:9px 16px;font-size:15px}
  .hint{font-size:12px!important;opacity:.7}
  .big{font:400 30px/1.2 "Press Start 2P",monospace;color:var(--lav2);margin:6px 0}
  .stars{font-size:22px;letter-spacing:2px;margin:2px 0}
  .reward{background:var(--navy);color:var(--cream);border-radius:12px;padding:10px;margin:8px 0}
  .reward code{display:inline-block;background:var(--cream);color:var(--navy);border-radius:8px;padding:4px 10px;font:700 18px monospace;letter-spacing:1px;margin:4px 0}
  .reward.locked{background:#eee8fb;color:var(--navy)}
  .points{font-size:14px;font-weight:600;margin:6px 0;min-height:1em}
  .levels{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin:8px 0}
  .levels span{height:10px;border-radius:3px;background:#e3dcf8}
  .levels span.on{background:var(--lav2)}
  #dpad{display:none;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,46px);gap:6px;flex:none}
  #dpad button{background:rgba(185,167,245,.22);border:2px solid rgba(185,167,245,.6);color:var(--cream);border-radius:12px;font-size:20px;touch-action:none}
  #dpad button:active{background:var(--lav);color:var(--navy)}
  #dpad .up{grid-column:2;grid-row:1}#dpad .left{grid-column:1;grid-row:2}#dpad .down{grid-column:2;grid-row:2}#dpad .right{grid-column:3;grid-row:2}
  @media (pointer:coarse){#dpad{display:grid}}
  .hidden{display:none!important}
  .toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--gold);color:var(--navy);font-weight:700;
    padding:4px 12px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
  .toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">PETAL <span>SNAKE</span></div>
    <div class="row">
      <div class="pill">Lv <b id="lvl">1</b> · <b id="goal">0/7</b></div>
      <div class="pill">Score <b id="score">0</b></div>
    </div>
    <div class="row">
      <button class="iconbtn" id="pauseBtn" title="Pause" aria-label="Pause">❚❚</button>
      <button class="iconbtn" id="fsBtn" title="Full screen" aria-label="Full screen">⛶</button>
    </div>
  </header>
  <div id="bar"><i></i></div>

  <div id="stage">
    <canvas id="c" aria-label="Petal Snake game board"></canvas>
    <div class="toast" id="toast"></div>

    <div class="overlay" id="startScreen">
      <div class="card">
        <h1>PETAL <span>SNAKE</span></h1>
        <p>Grow your brick vine and pick flowers. Clear all <b>10 levels</b> to finish the bouquet. Don't hit walls, bricks or your own vine!</p>
        <div class="legend" id="legend"></div>
        <button class="btn" id="startBtn">▶ Play</button>
        <p class="hint" id="bestStart"></p>
        <p class="hint">Arrow keys / WASD · Swipe on phones · Space to pause</p>
      </div>
    </div>

    <div class="overlay hidden" id="pauseScreen">
      <div class="card">
        <h1>PAUSED</h1>
        <button class="btn" id="resumeBtn">▶ Resume</button>
      </div>
    </div>

    <div class="overlay hidden" id="levelScreen">
      <div class="card">
        <p class="hint" style="margin:0">Level <span id="lcNum">1</span> cleared!</p>
        <h1 id="lcTitle">NICE!</h1>
        <div class="stars" id="lcStars"></div>
        <p id="lcBonus"></p>
        <div class="levels" id="lcLevels"></div>
        <p id="lcNext" style="font-weight:600"></p>
        <button class="btn" id="nextBtn">Next level ▶</button>
      </div>
    </div>

    <div class="overlay hidden" id="overScreen">
      <div class="card">
        <p style="margin:0;font-weight:600" id="overHead">Game over</p>
        <div class="big" id="finalScore">0</div>
        <p id="levelLine" style="font-weight:600;margin:2px 0"></p>
        <div class="levels" id="overLevels"></div>
        <p id="bestLine" class="hint"></p>
        <div class="reward locked" id="reward"></div>
        <div class="points hidden" id="points"></div>
        <button class="btn ghost hidden" id="loginBtn">Log in to collect points</button>
        <button class="btn" id="againBtn">↻ Play Again</button>
        <a class="btn alt" href="https://www.buildpetals.com/product-page/mystery-flower" target="_top">Shop Mystery Flowers</a>
      </div>
    </div>
  </div>

  <div id="dpad">
    <button class="up" data-d="up" aria-label="Up">▲</button>
    <button class="left" data-d="left" aria-label="Left">◀</button>
    <button class="down" data-d="down" aria-label="Down">▼</button>
    <button class="right" data-d="right" aria-label="Right">▶</button>
  </div>
</div>

<script>
/* =========================================================
   CONFIG — change the math here
   ========================================================= */
const CONFIG = {
  GRID: 18,
  LEVELS: 10,
  // per level: flowers to pick, ms per move (lower = faster)
  GOAL:  [7, 8, 9, 10, 10, 11, 12, 12, 13, 15],
  SPEED: [150,140,132,124,116,108,100, 94, 88, 82],
  LEVEL_BONUS: 50,          // bonus = LEVEL_BONUS × level number
  REWARD_LEVEL: 5,          // clear this many levels to unlock the discount code
  REWARD_CODE: "PETALSNAKE",// create this coupon in Wix → Marketing → Coupons
  REWARD_TEXT: "10% off your next order",
  RARE_CHANCE: 0.12, RARE_LIFETIME_MS: 7000,
  MYSTERY_CHANCE: 0.08, MYSTERY_LIFETIME_MS: 6000, MYSTERY_POINTS: [20, 80],
};

/* =========================================================
   PIXEL FLOWERS (10×10 sprites, '.' = empty)
   ========================================================= */
const SPRITES = {
  rose: { name:"Rose", pts:10, weight:5, pal:{ p:"#ff8fc2", P:"#d94f8c", w:"#ffd6ea", g:"#4cc36a", G:"#2b8a44" }, art:[
    "...PPPP...",
    "..PppppP..",
    ".PpPwwPpP.",
    ".PppPPppP.",
    ".PpppppPP.",
    "..PPpPPP..",
    "...PPPP...",
    ".gg.g.....",
    "..ggG.gg..",
    "....G.....",
  ]},
  tulip: { name:"Tulip", pts:10, weight:5, pal:{ r:"#ff5a5f", R:"#c3283a", w:"#ffb3b5", g:"#4cc36a", G:"#2b8a44" }, art:[
    "..r.rr.r..",
    "..rrrRrr..",
    "..rwrrRr..",
    "..rwrrRr..",
    "..rrrrRr..",
    "...RRRR...",
    "....gG....",
    ".gg.gG....",
    "..gggG....",
    "....gG....",
  ]},
  daisy: { name:"Daisy", pts:15, weight:4, pal:{ w:"#ffffff", W:"#d9d4f0", y:"#ffd166", Y:"#f08c00" }, art:[
    "....ww....",
    ".w..ww..w.",
    "..wwWWww..",
    "..wWyyWw..",
    "wwWyYYyWww",
    "wwWyYYyWww",
    "..wWyyWw..",
    "..wwWWww..",
    ".w..ww..w.",
    "....ww....",
  ]},
  bluebell: { name:"Bachelor's Button", pts:20, weight:3, pal:{ b:"#4f7cff", B:"#2b4bc9", l:"#9fb8ff", w:"#ffffff", y:"#ffd166" }, art:[
    ".b..b..b..",
    "..bBlBb...",
    "b.blBlb.b.",
    ".bBbwbBb..",
    "bblwywlbb.",
    ".bBbwbBb..",
    "b.blBlb.b.",
    "..bBlBb...",
    ".b..b..b..",
    "..........",
  ]},
  sunflower: { name:"Sunflower", pts:25, weight:2, pal:{ y:"#ffd166", Y:"#f2a900", b:"#8a4b1f", B:"#5c2e0e" }, art:[
    "...yYYy...",
    "..yYyyYy..",
    ".yybbbbyy.",
    "yYbbBbbbYy",
    "yybBbbBbyy",
    "yybbbBbbyy",
    "yYbbBbbbYy",
    ".yybbbbyy.",
    "..yYyyYy..",
    "...yYYy...",
  ]},
};
const RARE_SPRITE = { name:"Phantom Rose (glow)", pts:50, pal:{ p:"#b8ffc8", P:"#4dd97a", w:"#ffffff", g:"#9dffb0", G:"#4dd97a" }, art: SPRITES.rose.art };
const MYSTERY_SPRITE = { pal:{ y:"#ffd166", Y:"#e0a400", n:"#101a42" }, art:[
  "YYYYYYYYYY",
  "YyyyyyyyyY",
  "YyyynnnyyY",
  "YyynyyynyY",
  "YyyyyyynyY",
  "YyyyynnyyY",
  "YyyyynyyyY",
  "YyyyyyyyyY",
  "YyyyynyyyY",
  "YYYYYYYYYY",
]};
const FLOWERS = Object.entries(SPRITES).map(([key,s]) => Object.assign({ key }, s));
const RARE = Object.assign({ key:"phantom", rare:true }, RARE_SPRITE);

// pre-render each sprite once to an offscreen canvas (crisp pixels)
function bake(s){
  const c = document.createElement("canvas"); c.width = c.height = 10;
  const x = c.getContext("2d");
  s.art.forEach((row, y) => [...row].forEach((ch, i) => { if (s.pal[ch]){ x.fillStyle = s.pal[ch]; x.fillRect(i, y, 1, 1); } }));
  return c;
}
[...FLOWERS, RARE, MYSTERY_SPRITE].forEach(s => s.img = bake(s));

function thumb(s, px){
  const c = document.createElement("canvas"); c.width = c.height = px; c.style.width = c.style.height = px+"px";
  const x = c.getContext("2d"); x.imageSmoothingEnabled = false; x.drawImage(s.img, 0, 0, px, px); return c;
}
const legend = document.getElementById("legend");
[...FLOWERS, RARE].forEach(f => { const d = document.createElement("div"); d.title = f.name; d.appendChild(thumb(f, 30)); d.append(`${f.pts}${f.rare ? " ✨" : ""}`); legend.appendChild(d); });
{ const d = document.createElement("div"); d.appendChild(thumb(MYSTERY_SPRITE, 30)); d.append("bonus"); legend.appendChild(d); }

/* =========================================================
   LEVEL LAYOUTS — brick obstacles
   ========================================================= */
const G = CONFIG.GRID, M = Math.floor(G/2);
function layout(level){
  const b = new Set(), add = (x,y) => { if (x>=0&&y>=0&&x<G&&y<G) b.add(x+","+y); };
  const hline = (y,x0,x1) => { for (let x=x0;x<=x1;x++) add(x,y); };
  const vline = (x,y0,y1) => { for (let y=y0;y<=y1;y++) add(x,y); };
  const block = (x,y) => { add(x,y); add(x+1,y); add(x,y+1); add(x+1,y+1); };
  switch (level){
    case 1: case 2: break;
    case 3: block(3,3); block(G-5,3); block(3,G-5); block(G-5,G-5); break;
    case 4: hline(4,4,G-5); hline(G-5,4,G-5); break;
    case 5: vline(4,3,G-4); vline(G-5,3,G-4); hline(3,8,9); hline(G-4,8,9); break;
    case 6: hline(3,2,7); hline(3,G-8,G-3); hline(G-4,2,7); hline(G-4,G-8,G-3); vline(2,4,6); vline(G-3,4,6); vline(2,G-7,G-5); vline(G-3,G-7,G-5); break;
    case 7: for (let i=2;i<G-2;i+=4){ vline(i,1,5); vline(i+2,G-6,G-2); } break;
    case 8: hline(2,2,G-3); vline(G-3,2,6); hline(G-3,2,G-3); vline(2,G-7,G-3); hline(5,5,G-6); hline(G-6,5,G-6); break;
    case 9: for (let y=2;y<G-1;y+=3) for (let x=(y%2?2:4);x<G-1;x+=5) block(x,y); break;
    case 10: vline(3,1,6); vline(3,G-7,G-2); vline(G-4,1,6); vline(G-4,G-7,G-2); hline(3,6,G-7); hline(G-4,6,G-7); block(M-6,M-1); block(M+4,M-1); break;
  }
  // keep the starting lane clear
  for (let x=M-6;x<=M+4;x++) for (let y=M-1;y<=M+1;y++) b.delete(x+","+y);
  return b;
}

/* ---------- storage (safe) ---------- */
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

/* ---------- canvas sizing ---------- */
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const stage = document.getElementById("stage");
let cell = 20, size = 360;
function resize(){
  const r = stage.getBoundingClientRect();
  size = Math.max(180, Math.floor(Math.min(r.width, r.height) - 6));
  cell = Math.floor(size / G); size = cell * G;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = size * dpr; cv.height = size * dpr;
  cv.style.width = size + "px"; cv.style.height = size + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.imageSmoothingEnabled = false;
  draw();
}
window.addEventListener("resize", resize);

/* ---------- game state ---------- */
const DIRS = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };
let snake, dir, queue, items, bricks, score = 0, level = 1, cleared = 0, got = 0, speed, state = "start", lastStep = 0, startTime = 0;
let best = store.get("bp_snake_best", 0), bestLevel = store.get("bp_snake_bestlvl", 0);
const $ = id => document.getElementById(id);
function bestText(){ return best ? `Best: ${best} pts · ${bestLevel}/10 levels cleared` : ""; }
$("bestStart").textContent = bestText();

function setupLevel(){
  snake = [[M-1,M],[M-2,M],[M-3,M]];
  dir = "right"; queue = []; items = []; got = 0;
  bricks = layout(level);
  speed = CONFIG.SPEED[level-1];
  spawn("normal"); hud();
}
function hud(){
  $("score").textContent = score; $("lvl").textContent = level;
  const goal = CONFIG.GOAL[level-1]; $("goal").textContent = `${got}/${goal}`;
  document.querySelector("#bar i").style.width = (100*got/goal) + "%";
}
const isBrick = (x,y) => bricks.has(x+","+y);
function freeCell(){
  for (let t = 0; t < 800; t++){
    const x = Math.floor(Math.random()*G), y = Math.floor(Math.random()*G);
    if (!isBrick(x,y) && !snake.some(s => s[0]===x && s[1]===y) && !items.some(i => i.x===x && i.y===y)) return [x,y];
  }
  return null;
}
function pickWeighted(){
  const tot = FLOWERS.reduce((a,f)=>a+f.weight,0); let r = Math.random()*tot;
  for (const f of FLOWERS){ if ((r -= f.weight) < 0) return f; } return FLOWERS[0];
}
function spawn(kind){
  const c = freeCell(); if (!c) return;
  const now = performance.now();
  if (kind === "normal") items.push({ x:c[0], y:c[1], f:pickWeighted(), kind, born:now });
  if (kind === "rare")   items.push({ x:c[0], y:c[1], f:RARE, kind, born:now, life:CONFIG.RARE_LIFETIME_MS });
  if (kind === "mystery")items.push({ x:c[0], y:c[1], f:MYSTERY_SPRITE, kind, born:now, life:CONFIG.MYSTERY_LIFETIME_MS });
}
function setDir(d){
  if (state !== "play") return;
  const last = queue.length ? queue[queue.length-1] : dir;
  const [ax,ay] = DIRS[last], [bx,by] = DIRS[d];
  if (ax + bx === 0 && ay + by === 0) return;
  if (d === last) return;
  if (queue.length < 3) queue.push(d);
}

function step(){
  if (queue.length) dir = queue.shift();
  const [dx,dy] = DIRS[dir];
  const head = [snake[0][0]+dx, snake[0][1]+dy];
  if (head[0]<0 || head[1]<0 || head[0]>=G || head[1]>=G || isBrick(head[0],head[1])) return gameOver();
  if (snake.slice(0,-1).some(s => s[0]===head[0] && s[1]===head[1])) return gameOver();
  snake.unshift(head);
  const hit = items.findIndex(i => i.x===head[0] && i.y===head[1]);
  if (hit < 0){ snake.pop(); return; }
  const it = items.splice(hit,1)[0];
  if (it.kind === "mystery"){
    const [a,b] = CONFIG.MYSTERY_POINTS, gain = Math.round((a + Math.random()*(b-a))/5)*5;
    score += gain; toast(`Mystery box! +${gain}`);
  } else {
    score += it.f.pts; got++;
    if (it.kind === "rare") toast(`✨ Phantom Rose! +${it.f.pts}`);
  }
  hud();
  if (got >= CONFIG.GOAL[level-1]) return levelClear();
  if (it.kind === "normal"){
    spawn("normal");
    if (!items.some(i=>i.kind==="rare")    && Math.random() < CONFIG.RARE_CHANCE)    spawn("rare");
    if (!items.some(i=>i.kind==="mystery") && Math.random() < CONFIG.MYSTERY_CHANCE) spawn("mystery");
  }
}

/* ---------- drawing ---------- */
function drawBoard(){
  ctx.fillStyle = "#0d1638"; ctx.fillRect(0,0,size,size);
  for (let y=0;y<G;y++) for (let x=0;x<G;x++) if ((x+y)%2===0){ ctx.fillStyle = "rgba(143,199,255,.045)"; ctx.fillRect(x*cell,y*cell,cell,cell); }
}
function brick(x, y, body, top, stud){
  const px = x*cell, py = y*cell, u = Math.max(1, Math.round(cell/10));
  ctx.fillStyle = body; ctx.fillRect(px+u, py+u, cell-2*u, cell-2*u);
  ctx.fillStyle = "rgba(0,0,0,.22)"; ctx.fillRect(px+u, py+cell-3*u, cell-2*u, 2*u);
  ctx.fillStyle = top; ctx.fillRect(px+u, py+u, cell-2*u, u);
  const s = Math.round(cell*.36); ctx.fillStyle = stud; ctx.fillRect(px+(cell-s)/2, py+(cell-s)/2 - u, s, s);
  ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.fillRect(px+(cell-s)/2, py+(cell-s)/2 - u, s, u);
}
function drawItem(it, now){
  const bob = Math.round(Math.sin((now - it.born)/260) * cell*.06);
  let alpha = 1;
  if (it.life){ const left = it.life - (now - it.born); if (left < 1800) alpha = (Math.floor(left/150)%2) ? .35 : 1; }
  ctx.save(); ctx.globalAlpha = alpha;
  if (it.kind === "rare"){ ctx.shadowColor = "#9dffb0"; ctx.shadowBlur = cell*.8 + Math.sin(now/180)*cell*.3; }
  ctx.drawImage(it.f.img, it.x*cell, it.y*cell + bob, cell, cell);
  ctx.restore();
}
function draw(now = performance.now()){
  if (!snake) return;
  drawBoard();
  bricks.forEach(k => { const [x,y] = k.split(",").map(Number); brick(x, y, "#8f7ae6", "#b9a7f5", "#a593ee"); });
  items.forEach(it => drawItem(it, now));
  for (let i = snake.length-1; i >= 0; i--){
    const [x,y] = snake[i];
    brick(x, y, i===0 ? "#2f9a4a" : (i%2 ? "#3aa553" : "#43b85e"), "#6fd98a", i===0 ? "#38ad55" : "#55c96f");
  }
  // pixel eyes on head
  const [hx,hy] = snake[0], [dx,dy] = DIRS[dir], u = Math.max(2, Math.round(cell/7));
  const cx = hx*cell + cell/2 + dx*cell*.2, cy = hy*cell + cell/2 + dy*cell*.2;
  for (const s of [-1,1]){
    const ex = cx + dy*cell*.2*s - u/2, ey = cy + dx*cell*.2*s - u/2;
    ctx.fillStyle = "#fff"; ctx.fillRect(ex-u/2, ey-u/2, u*2, u*2);
    ctx.fillStyle = "#101a42"; ctx.fillRect(ex + dx*u/2, ey + dy*u/2, u, u);
  }
}

/* ---------- loop ---------- */
function loop(now){
  if (state === "play"){
    items = items.filter(it => !it.life || now - it.born < it.life);
    if (now - lastStep >= speed){ lastStep = now; step(); }
  }
  draw(now);
  requestAnimationFrame(loop);
}

/* ---------- screens ---------- */
function show(id){ ["startScreen","pauseScreen","levelScreen","overScreen"].forEach(s => $(s).classList.toggle("hidden", s !== id)); }
function levelBar(el, n){ el.innerHTML = Array.from({length:CONFIG.LEVELS}, (_,i) => `<span class="${i<n?"on":""}"></span>`).join(""); }
function start(){ score = 0; level = 1; cleared = 0; startTime = Date.now(); setupLevel(); state = "play"; lastStep = performance.now(); show(null); }
function pause(){ if (state === "play"){ state = "pause"; show("pauseScreen"); } }
function resume(){ if (state === "pause"){ state = "play"; lastStep = performance.now(); show(null); } }
let toastT; function toast(t){ const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove("on"), 1300); }

const TITLES = ["SPROUT!","BUDDING!","BLOOMING!","GREEN THUMB!","GARDENER!","FLORIST!","BOUQUET PRO!","PETAL MASTER!","BLOOM LEGEND!","FULL BOUQUET!"];
function levelClear(){
  cleared = level;
  const bonus = CONFIG.LEVEL_BONUS * level; score += bonus; hud();
  if (level >= CONFIG.LEVELS) return gameOver(true);
  state = "level";
  $("lcNum").textContent = level; $("lcTitle").textContent = TITLES[level-1];
  $("lcStars").textContent = "🌸".repeat(Math.min(3, 1 + Math.floor(level/4)));
  $("lcBonus").textContent = `Level bonus +${bonus} · Score ${score}`;
  levelBar($("lcLevels"), cleared);
  $("lcNext").textContent = level + 1 === CONFIG.REWARD_LEVEL + 1 ? `🎁 Code unlocked! Level ${level+1} next.` : `Level ${level+1}: pick ${CONFIG.GOAL[level]} flowers${level+1 >= 3 ? " · watch the bricks" : ""}`;
  show("levelScreen");
}
function nextLevel(){ if (state !== "level") return; level++; setupLevel(); state = "play"; lastStep = performance.now(); show(null); }

function gameOver(won){
  state = "over";
  const newBest = score > best; if (newBest){ best = score; store.set("bp_snake_best", best); }
  if (cleared > bestLevel){ bestLevel = cleared; store.set("bp_snake_bestlvl", bestLevel); }
  $("bestStart").textContent = bestText();
  $("overHead").textContent = won ? "🏆 You finished the bouquet!" : "Game over";
  $("finalScore").textContent = score;
  $("levelLine").textContent = won ? "All 10 levels cleared!" : `Levels cleared: ${cleared} / ${CONFIG.LEVELS}`;
  levelBar($("overLevels"), cleared);
  $("bestLine").textContent = newBest && score > 0 ? "🎉 New personal best!" : `Personal best: ${best}`;

  const rw = $("reward");
  if (cleared >= CONFIG.REWARD_LEVEL){
    rw.className = "reward";
    rw.innerHTML = `<div style="font-weight:700">You unlocked ${CONFIG.REWARD_TEXT}!</div><code>${CONFIG.REWARD_CODE}</code><br><button class="btn" style="padding:6px 14px;font-size:14px" id="copyBtn">Copy code</button>`;
    $("copyBtn").onclick = () => { try { navigator.clipboard.writeText(CONFIG.REWARD_CODE); $("copyBtn").textContent = "Copied!"; } catch(e){} };
  } else {
    rw.className = "reward locked";
    rw.innerHTML = `Clear <b>${CONFIG.REWARD_LEVEL} levels</b> to unlock <b>${CONFIG.REWARD_TEXT}</b>`;
  }

  $("loginBtn").classList.add("hidden");
  const pts = $("points");
  if (window.parent !== window){
    pts.classList.remove("hidden"); pts.textContent = "Checking loyalty points…";
    send({ type:"gameOver", game:"petal-snake", score, levelsCleared: cleared, durationMs: Date.now() - startTime });
    clearTimeout(window._ptsT); window._ptsT = setTimeout(() => { if (pts.textContent.startsWith("Checking")) pts.classList.add("hidden"); }, 6000);
  } else pts.classList.add("hidden");
  show("overScreen");
}

/* ---------- messaging with the Wix page ---------- */
function send(msg){ try { window.parent.postMessage(Object.assign({ source:"buildpetals-arcade" }, msg), "*"); } catch(e){} }
window.addEventListener("message", e => {
  const m = e.data; if (!m || m.source !== "buildpetals-site" || m.type !== "pointsResult") return;
  const pts = $("points"); pts.classList.remove("hidden");
  const msgs = {
    awarded:  `🌸 +${m.points} loyalty points!${m.balance != null ? ` Balance: ${m.balance}` : ""}${m.todayLeft != null ? ` · ${m.todayLeft} more available today` : ""}`,
    capped:   `You've hit today's arcade points limit. Come back tomorrow!`,
    monthCap: `You've earned this month's arcade points max. Thanks for playing!`,
    noGain:   `Beat your best level today to earn more points.`,
    belowMin: `Clear ${m.minLevels} levels to earn loyalty points.`,
    login:    `Members earn loyalty points for playing.`,
    error:    `Couldn't add points right now — try again later.`,
  };
  pts.textContent = msgs[m.status] || "";
  $("loginBtn").classList.toggle("hidden", m.status !== "login");
});
$("loginBtn").onclick = () => send({ type:"login", game:"petal-snake" });

/* ---------- input ---------- */
const KEYS = { ArrowUp:"up", ArrowDown:"down", ArrowLeft:"left", ArrowRight:"right", w:"up", s:"down", a:"left", d:"right", W:"up", S:"down", A:"left", D:"right" };
window.addEventListener("keydown", e => {
  if (KEYS[e.key]){ e.preventDefault(); setDir(KEYS[e.key]); }
  else if (e.key === " " || e.key === "p" || e.key === "P" || e.key === "Enter"){
    e.preventDefault();
    if (state === "play") pause(); else if (state === "pause") resume(); else if (state === "level") nextLevel(); else start();
  }
});
let tx = null, ty = null;
stage.addEventListener("touchstart", e => { const t = e.touches[0]; tx = t.clientX; ty = t.clientY; }, { passive:true });
stage.addEventListener("touchmove", e => {
  if (state === "play") e.preventDefault();
  if (tx === null) return;
  const t = e.touches[0], dx = t.clientX - tx, dy = t.clientY - ty;
  if (Math.max(Math.abs(dx), Math.abs(dy)) > 22){
    setDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
    tx = t.clientX; ty = t.clientY;
  }
}, { passive:false });
stage.addEventListener("touchend", () => { tx = ty = null; });
document.querySelectorAll("#dpad button").forEach(b => b.addEventListener("pointerdown", e => { e.preventDefault(); setDir(b.dataset.d); }));

$("startBtn").onclick = start; $("againBtn").onclick = start; $("resumeBtn").onclick = resume; $("nextBtn").onclick = nextLevel;
$("pauseBtn").onclick = () => state === "play" ? pause() : resume();
$("fsBtn").onclick = () => {
  const el = document.documentElement;
  if (document.fullscreenElement) return document.exitFullscreen();
  if (document.fullscreenEnabled && el.requestFullscreen) el.requestFullscreen().catch(() => window.open(location.href, "_blank"));
  else window.open(location.href, "_blank");
};
document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });
window.addEventListener("blur", pause);

setupLevel(); state = "start"; resize(); requestAnimationFrame(loop);
send({ type:"ready", game:"petal-snake" });
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Petal Snake · Build Petals Arcade</title>
<script src="../kit/arcade-kit.js"></script>
</head>
<body>
<script>
/* PETAL SNAKE — grow a brick vine, pick flowers, avoid walls and bricks. */
const G = 18, CELL = 20, M = Math.floor(G / 2);
const GOAL = [8, 10, 12, 14, 16, 18, 20, 22, 25, 28];
const SPEED = [145, 130, 120, 110, 100, 92, 85, 78, 72, 66]; // ms per move
const FLOWERS = [["rose", 10, 5], ["tulip", 10, 5], ["daisy", 15, 4], ["bluebell", 20, 3], ["sunflower", 25, 2]];
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
let snake, dir, queue, items, bricks, acc;

function layout(level) {
  const b = new Set(), add = (x, y) => { if (x >= 0 && y >= 0 && x < G && y < G) b.add(x + "," + y); };
  const hline = (y, x0, x1) => { for (let x = x0; x <= x1; x++) add(x, y); };
  const vline = (x, y0, y1) => { for (let y = y0; y <= y1; y++) add(x, y); };
  const block = (x, y) => { add(x, y); add(x + 1, y); add(x, y + 1); add(x + 1, y + 1); };
  switch (level) {
    case 3: block(3, 3); block(G - 5, 3); block(3, G - 5); block(G - 5, G - 5); break;
    case 4: hline(4, 4, G - 5); hline(G - 5, 4, G - 5); break;
    case 5: vline(4, 3, G - 4); vline(G - 5, 3, G - 4); hline(3, 8, 9); hline(G - 4, 8, 9); break;
    case 6: hline(3, 2, 7); hline(3, G - 8, G - 3); hline(G - 4, 2, 7); hline(G - 4, G - 8, G - 3); vline(2, 4, 6); vline(G - 3, 4, 6); vline(2, G - 7, G - 5); vline(G - 3, G - 7, G - 5); break;
    case 7: for (let i = 2; i < G - 2; i += 4) { vline(i, 1, 5); vline(i + 2, G - 6, G - 2); } break;
    case 8: hline(2, 2, G - 3); vline(G - 3, 2, 6); hline(G - 3, 2, G - 3); vline(2, G - 7, G - 3); hline(5, 5, G - 6); hline(G - 6, 5, G - 6); break;
    case 9: for (let y = 2; y < G - 1; y += 3) for (let x = (y % 2 ? 2 : 4); x < G - 1; x += 5) block(x, y); break;
    case 10: vline(3, 1, 6); vline(3, G - 7, G - 2); vline(G - 4, 1, 6); vline(G - 4, G - 7, G - 2); hline(3, 6, G - 7); hline(G - 4, 6, G - 7); block(M - 6, M - 1); block(M + 4, M - 1); break;
  }
  for (let x = M - 6; x <= M + 4; x++) for (let y = M - 1; y <= M + 1; y++) b.delete(x + "," + y);
  return b;
}
const isBrick = (x, y) => bricks.has(x + "," + y);
function freeCell() {
  for (let t = 0; t < 800; t++) {
    const x = Math.floor(Math.random() * G), y = Math.floor(Math.random() * G);
    if (!isBrick(x, y) && !snake.some((s) => s[0] === x && s[1] === y) && !items.some((i) => i.x === x && i.y === y)) return [x, y];
  }
  return null;
}
function weighted() { const tot = FLOWERS.reduce((a, f) => a + f[2], 0); let r = Math.random() * tot; for (const f of FLOWERS) if ((r -= f[2]) < 0) return f; return FLOWERS[0]; }
function spawn(kind, kit) {
  const c = freeCell(); if (!c) return;
  if (kind === "normal") { const f = weighted(); items.push({ x: c[0], y: c[1], s: f[0], pts: f[1], kind, born: kit.now }); }
  if (kind === "rare") items.push({ x: c[0], y: c[1], s: "phantom", pts: 50, kind, born: kit.now, life: 7000 });
  if (kind === "mystery") items.push({ x: c[0], y: c[1], s: "mystery", kind, born: kit.now, life: 6000 });
}
function setDir(d) {
  const last = queue.length ? queue[queue.length - 1] : dir, [ax, ay] = DIRS[last], [bx, by] = DIRS[d];
  if ((ax + bx === 0 && ay + by === 0) || d === last) return;
  if (queue.length < 3) queue.push(d);
}
function step(kit) {
  if (queue.length) dir = queue.shift();
  const [dx, dy] = DIRS[dir], head = [snake[0][0] + dx, snake[0][1] + dy];
  if (head[0] < 0 || head[1] < 0 || head[0] >= G || head[1] >= G || isBrick(head[0], head[1])) return kit.fail();
  if (snake.slice(0, -1).some((s) => s[0] === head[0] && s[1] === head[1])) return kit.fail();
  snake.unshift(head);
  const hit = items.findIndex((i) => i.x === head[0] && i.y === head[1]);
  if (hit < 0) { snake.pop(); return; }
  const it = items.splice(hit, 1)[0];
  if (it.kind === "mystery") { const g = Math.round(Arcade.rand(20, 80) / 5) * 5; kit.add(g); kit.toast(`Mystery box! +${g}`); return; }
  if (it.kind === "rare") kit.toast("✨ Phantom Rose! +50");
  kit.add(it.pts);
  if (it.kind === "normal") {
    spawn("normal", kit);
    if (!items.some((i) => i.kind === "rare") && Math.random() < 0.12) spawn("rare", kit);
    if (!items.some((i) => i.kind === "mystery") && Math.random() < 0.08) spawn("mystery", kit);
  }
  kit.collect();
}

Arcade.run({
  id: "petal-snake",
  title: ["PETAL", "SNAKE"],
  blurb: "Grow your brick vine and pick flowers. Clear all <b>10 levels</b> to finish the bouquet. Don't hit walls, bricks or your own vine!",
  hint: "Phones: swipe anywhere to steer · Arrow keys / WASD · Space to pause",
  legend: [{ sprite: "rose", label: "10" }, { sprite: "tulip", label: "10" }, { sprite: "daisy", label: "15" }, { sprite: "bluebell", label: "20" }, { sprite: "sunflower", label: "25" }, { sprite: "phantom", label: "50 ✨" }, { sprite: "mystery", label: "bonus" }],
  width: G * CELL, height: G * CELL, dpad: false, swipeAnywhere: true,
  goal: (l) => GOAL[l - 1],
  goalLabel: (l) => `pick ${GOAL[l - 1]} flowers${l >= 3 ? " · watch the bricks" : ""}`,
  setup(level, kit) {
    snake = [[M - 1, M], [M - 2, M], [M - 3, M]]; dir = "right"; queue = []; items = []; acc = 0;
    bricks = layout(level); spawn("normal", kit);
  },
  update(dt, kit) {
    items = items.filter((it) => !it.life || kit.now - it.born < it.life);
    acc += dt * 1000;
    const sp = SPEED[kit.level - 1] / Arcade.speedUp(kit, 0.004, 0.12);
    if (acc >= sp) { acc = 0; step(kit); }
  },
  key(k) {
    const map = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right" };
    if (map[k]) { setDir(map[k]); return true; }
    return false;
  },
  swipe(d) { setDir(d); },
  draw(ctx, kit) {
    const SP = Arcade.softPaper, h = CELL / 2;
    Arcade.grid(ctx, G * CELL, G * CELL, CELL);
    bricks.forEach((k) => { const [x, y] = k.split(",").map(Number); Arcade.brick(ctx, x * CELL, y * CELL, CELL, CELL, "#b79ae0"); });
    for (const it of items) {
      let alpha = 1;
      if (it.life) { const left = it.life - (kit.now - it.born); if (left < 1800) alpha = Math.floor(left / 150) % 2 ? 0.35 : 1; }
      const bob = Math.sin((kit.now - it.born) / 260) * 1.2;
      Arcade.drawSprite(ctx, it.s, it.x * CELL - 1, it.y * CELL - 1 + bob, CELL + 2, { alpha });
    }
    /* the vine: one soft green band, then a paper bead per segment, with small leaves */
    ctx.save(); ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.shadowColor = "rgba(30,60,30,.25)"; ctx.shadowBlur = 4; ctx.shadowOffsetY = 2;
    ctx.strokeStyle = "#4f9e4c"; ctx.lineWidth = CELL * 0.62; ctx.beginPath();
    snake.forEach(([x, y], i) => (i ? ctx.lineTo(x * CELL + h, y * CELL + h) : ctx.moveTo(x * CELL + h, y * CELL + h))); ctx.stroke(); ctx.restore();
    for (let i = snake.length - 1; i >= 1; i--) {
      const [x, y] = snake[i];
      SP.piece(ctx, SP.circ(x * CELL + h, y * CELL + h, CELL * 0.4), i % 2 ? "#6cc06a" : "#5fb35d", 0.8);
      if (i % 3 === 0) SP.piece(ctx, SP.ell(x * CELL + h + 5, y * CELL + h - 5, 5, 2.4, -0.7), "#9bdc85", 0.6);
    }
    const [hx, hy] = snake[0], [dx, dy] = DIRS[dir], cx = hx * CELL + h, cy = hy * CELL + h;
    SP.piece(ctx, SP.circ(cx, cy, CELL * 0.52), "#3f9a4a", 1);
    for (const s of [-1, 1]) {
      const ex = cx + dx * 3 + dy * 4.5 * s, ey = cy + dy * 3 + dx * 4.5 * s;
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ex, ey, 3.2, 0, 7); ctx.fill();
      ctx.fillStyle = "#101a42"; ctx.beginPath(); ctx.arc(ex + dx * 1.2, ey + dy * 1.2, 1.8, 0, 7); ctx.fill();
    }
    ctx.fillStyle = "#f3a5b7"; ctx.beginPath(); ctx.arc(cx - dx * 3 + dy * 6, cy - dy * 3 + dx * 6, 1.6, 0, 7); ctx.arc(cx - dx * 3 - dy * 6, cy - dy * 3 - dx * 6, 1.6, 0, 7); ctx.fill();
  },
});
</script>
</body>
</html>

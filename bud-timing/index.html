<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bud Timing · Build Petals Arcade</title>
<script src="../kit/arcade-kit.js"></script>
</head>
<body>
<script>
/* BUD TIMING — tap each flower the moment it's in full bloom. Too early and it's still a bud; too late and it wilts. */
const W = 360, H = 480;
const GOAL = [8, 10, 12, 15, 18, 20, 22, 25, 28, 32];
const L = (lv, a, b) => Arcade.lerpLevel(lv, a, b);
const KINDS = ["rose", "tulip", "daisy", "sunflower", "bluebell", "lily", "poppy"];
let pots, fx, spawnIn;

function layout(level) {
  const n = level >= 7 ? 6 : level >= 4 ? 5 : 4;
  const spots = { 4: [[0.3, 0.32], [0.7, 0.32], [0.3, 0.7], [0.7, 0.7]], 5: [[0.22, 0.3], [0.5, 0.3], [0.78, 0.3], [0.33, 0.68], [0.67, 0.68]], 6: [[0.22, 0.3], [0.5, 0.3], [0.78, 0.3], [0.22, 0.68], [0.5, 0.68], [0.78, 0.68]] }[n];
  pots = spots.map(([a, b]) => ({ x: a * W, y: b * H, f: null }));
}
function sprout(kit) {
  const free = pots.filter((p) => !p.f); if (!free.length) return;
  const p = Arcade.pick(free), lv = kit.level;
  const grow = L(lv, 2.2, 0.9) / Arcade.speedUp(kit, 0.008, 0.15) * Arcade.rand(0.8, 1.25), win = L(lv, 0.8, 0.28);
  p.f = { born: kit.now, grow: grow * 1000, win: win * 1000, kind: Arcade.pick(KINDS), done: 0, ok: false };
}
const stage = (f, now) => { const t = now - f.born; return t < f.grow ? t / f.grow : t < f.grow + f.win ? 1 : 2; };

Arcade.run({
  id: "bud-timing",
  title: ["BUD", "TIMING"],
  blurb: "Buds are popping up all over the garden. Tap each one when it's in <b>full bloom</b> (the ring turns gold). Tap too early or let it wilt and you lose a heart. Clear all <b>10 levels</b>.",
  hint: "Tap a flower when its ring is gold · Space to pause",
  legend: [{ sprite: "bud", label: "too soon" }, { sprite: "rose", label: "tap now!" }],
  width: W, height: H, lives: 3,
  goal: (l) => GOAL[l - 1],
  goalLabel: (l) => `catch ${GOAL[l - 1]} blooms${l === 4 ? " · 5 pots" : l === 7 ? " · 6 pots" : ""}`,
  setup(level, kit) { layout(level); fx = []; spawnIn = 0.4; },
  update(dt, kit) {
    spawnIn -= dt;
    const busy = pots.filter((p) => p.f && !p.f.done).length, max = Math.round(L(kit.level, 1.6, 4.2));
    if (spawnIn <= 0 && busy < max) { sprout(kit); spawnIn = L(kit.level, 1.1, 0.45) * Arcade.rand(0.8, 1.3); }
    for (const p of pots) {
      const f = p.f; if (!f) continue;
      if (f.done) { if (kit.now - f.done > 450) p.f = null; continue; }
      if (stage(f, kit.now) === 2) { f.done = kit.now; f.ok = false; fx.push({ x: p.x, y: p.y - 50, t: kit.now, txt: "wilted!", c: "#ff8fc2" }); kit.loseLife(); if (kit.state !== "play") return; }
    }
    fx = fx.filter((e) => kit.now - e.t < 700);
  },
  pointerDown(x, y, kit) {
    for (const p of pots) {
      const f = p.f; if (!f || f.done) continue;
      if (Math.hypot(x - p.x, y - (p.y - 20)) > 52) continue;
      const s = stage(f, kit.now);
      f.done = kit.now;
      if (s === 1) {
        f.ok = true; const into = (kit.now - f.born - f.grow) / f.win, perfect = into > 0.2 && into < 0.6;
        const g = perfect ? 30 : 15; kit.add(g);
        fx.push({ x: p.x, y: p.y - 56, t: kit.now, txt: perfect ? "perfect!" : "+" + g, c: "#ffd166" }); kit.collect();
      } else {
        f.ok = false; fx.push({ x: p.x, y: p.y - 56, t: kit.now, txt: "too soon!", c: "#ff8fc2" }); kit.loseLife();
      }
      return;
    }
  },
  draw(ctx, kit) {
    Arcade.grid(ctx, W, H, 24);
    for (const p of pots) {
      const f = p.f;
      if (f) {
        const s = f.done ? (f.ok ? 1 : 2) : stage(f, kit.now), cy = p.y - 22;
        // timing ring
        if (!f.done) {
          const prog = Math.min(1, (kit.now - f.born) / f.grow);
          ctx.lineWidth = 6; ctx.strokeStyle = "rgba(16,26,66,.25)"; ctx.beginPath(); ctx.arc(p.x, cy, 40, 0, 7); ctx.stroke();
          ctx.strokeStyle = s === 1 ? "#ffd166" : "#8fc7ff"; ctx.beginPath(); ctx.arc(p.x, cy, 40, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (s === 1 ? 1 : prog)); ctx.stroke();
          if (s === 1) { ctx.strokeStyle = "rgba(255,209,102,.5)"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(p.x, cy, 46 + Math.sin(kit.now / 60) * 2, 0, 7); ctx.stroke(); }
        }
        const t = f.done && !f.ok ? 2 : s;
        if (t === 1) { const sz = 56 + (f.done ? Math.min(1, (kit.now - f.done) / 200) * 12 : 0); Arcade.drawSprite(ctx, f.kind, p.x - sz / 2, cy - sz / 2, sz, { alpha: f.done ? 1 - (kit.now - f.done) / 450 : 1 }); }
        else if (t === 2) { ctx.save(); ctx.globalAlpha = 0.6; ctx.translate(p.x, cy + 8); ctx.rotate(0.5); Arcade.drawSprite(ctx, "bud", -20, -20, 40, { alpha: 0.5 }); ctx.restore(); }
        else { const sz = 26 + s * 26; Arcade.drawSprite(ctx, "bud", p.x - sz / 2, cy + 22 - sz, sz); }
      }
      // pot
      ctx.fillStyle = "#8a3f1c"; ctx.fillRect(p.x - 32, p.y + 6, 64, 9);
      ctx.fillStyle = "#c96a3a"; ctx.beginPath(); ctx.moveTo(p.x - 28, p.y + 15); ctx.lineTo(p.x + 28, p.y + 15); ctx.lineTo(p.x + 22, p.y + 44); ctx.lineTo(p.x - 22, p.y + 44); ctx.fill();
    }
    ctx.textAlign = "center"; ctx.font = '700 14px Fredoka, sans-serif';
    for (const e of fx) { const k = (kit.now - e.t) / 700; ctx.globalAlpha = 1 - k; ctx.fillStyle = e.c; Arcade.ink(ctx); ctx.strokeText(e.txt, e.x, e.y - k * 16); ctx.fillText(e.txt, e.x, e.y - k * 16); }
    ctx.globalAlpha = 1;
  },
});
</script>
</body>
</html>

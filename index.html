<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Petals Arcade</title>
<script src="kit/arcade-kit.js"></script>
<style>
  html,body{overflow:auto!important;height:auto;min-height:100%}
  .lobby{width:100%;max-width:9999px;padding:18px 14px 28px;text-align:center}
  .lobby h1{font:700 clamp(26px,7vw,36px)/1.2 "Fredoka",sans-serif;color:var(--ink);margin:6px 0 6px}
  .lobby h1 span{color:var(--lav2)}
  .lobby .sub{margin:0 0 18px;color:#5d6488;font-size:15px;font-weight:600}
  .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .tile{display:flex;flex-direction:column;align-items:center;gap:8px;background:#fff;color:var(--ink);border-radius:18px;padding:14px 8px 12px;text-decoration:none;box-shadow:0 4px 12px rgba(40,30,70,.16);position:relative}
  .tile:active{transform:translateY(2px)}
  .tile b{font:700 15px/1.3 "Fredoka",sans-serif}
  .tile .txt{display:flex;flex-direction:column;align-items:center;gap:8px}
  .tile .ic{display:flex;align-items:center;justify-content:center}
  .tile .play{display:none}
  .mhead{display:none}
  .tile small{font-size:13px;font-weight:600;color:#5d6488}
  .tile .tag{position:absolute;top:8px;right:8px;background:var(--gold);border-radius:999px;font-size:10px;font-weight:700;padding:2px 7px}
  .tile .tag.new{background:var(--rose);color:#fff}
  .tile.soon{background:rgba(255,255,255,.45);color:#7d84a8;box-shadow:none;border:2px dashed rgba(154,127,208,.45)}
  .tile.soon b{color:#7d84a8} .tile.soon small{color:#7d84a8} .tile.soon canvas{opacity:.45}
  .tile.done{opacity:.72;cursor:default}
  .tile.done small{color:#7E5FB5;font-weight:700}
  .tile.done .play{display:none}
  .lobby [hidden]{display:none!important}
  .cats{display:flex;gap:6px;justify-content:center;align-items:center;margin:0 0 14px;flex-wrap:wrap}
  .cats button{border:0;border-radius:999px;padding:8px 14px;font:700 14px "Fredoka",sans-serif;background:#fff;color:var(--lav2);box-shadow:0 2px 6px rgba(40,30,70,.12);cursor:pointer;min-height:36px}
  .cats button[aria-pressed="true"]{background:var(--lav);color:#fff}
  .cats .lay{margin-left:6px;background:transparent;box-shadow:none;border:2px solid #fff;padding:6px 12px}
  .catEmpty{background:#fff;border-radius:18px;padding:22px 16px;color:#5d6488;font-weight:600;box-shadow:0 4px 12px rgba(40,30,70,.16)}
  /* List layout on wider screens: two columns of game rows (phones are always a list) */
  .lobby.list .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .lobby.list .tile{flex-direction:row;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;text-align:left}
  .lobby.list .tile .ic{flex:none;width:56px;height:56px;border-radius:14px;background:#f1eafc}
  .lobby.list .tile canvas{width:40px!important;height:40px!important}
  .lobby.list .tile .txt{flex:1;min-width:0;align-items:flex-start;gap:5px}
  .lobby.list .tile b{font-size:16px;text-transform:none}
  .lobby.list .tile .tag{position:static;flex:none}
  .lobby.list .tile .play{display:flex;flex:none;width:44px;height:44px;border-radius:14px;background:var(--lav);align-items:center;justify-content:center}
  .boards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;text-align:left}
  .board{background:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 4px 12px rgba(40,30,70,.16)}
  .board h2{margin:0;font:700 17px "Fredoka",sans-serif;color:var(--ink)} .bsub{margin:2px 0 8px;font-size:12px;color:#5d6488;font-weight:600}
  .board select{font:700 16px "Fredoka",sans-serif;color:var(--ink);border:2px solid #e9e0f8;border-radius:10px;padding:4px 8px;background:#fff;max-width:100%}
  .board ol{margin:0;padding:0;list-style:none} .board li{display:flex;gap:10px;padding:6px 0;border-top:1px solid #f1eafc;font-weight:600;font-size:14px}
  .board li:first-child{border-top:0} .board li .n{width:22px;color:var(--lav2);font-weight:700} .board li .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .board li .v{font-weight:700;color:var(--ink)}
  .board li.me .who,.board li.me .v{color:var(--rose)} .board .empty{color:#7d84a8;font-size:13px;padding:6px 0}
  .foot{margin-top:18px;font-size:13px;color:#5d6488}
  .foot a{color:var(--lav2);font-weight:700}
  a.rw{display:flex;align-items:center;justify-content:center;min-height:48px;background:var(--gold);color:var(--navy);font-weight:700;font-size:15px;text-decoration:none;padding:10px 16px;border-radius:12px;box-shadow:0 4px 12px rgba(40,30,70,.16)}
  /* Phones: a one-column list of game cards with a play button */
  @media (max-width:560px){
    .lobby{padding:8px 12px 18px;text-align:left}
    .lobby h1,.lobby .sub{display:none}
    .mhead{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 14px}
    .mhead b{font:700 20px/1.3 "Fredoka",sans-serif;color:var(--ink)}
    .mhead span{font-size:14px;color:#5d6488;font-weight:700}
    .tiles{grid-template-columns:minmax(0,1fr);gap:14px}
    .tile{flex-direction:row;align-items:center;gap:14px;padding:12px 14px;border-radius:16px}
    .tile .ic{flex:none;width:56px;height:56px;border-radius:14px;background:#f1eafc}
    .tile canvas{width:40px!important;height:40px!important}
    .tile .txt{flex:1;min-width:0;align-items:flex-start;gap:5px}
    .tile b{font-size:16px;text-transform:none}
    .tile small{font-size:13px;font-weight:500}
    .tile .play{display:flex;flex:none;width:44px;height:44px;border-radius:14px;background:var(--lav);align-items:center;justify-content:center}
    .tile .tag{position:static;flex:none}
    .tile.soon .play{display:none}
    .foot{text-align:center}
    .boards{grid-template-columns:minmax(0,1fr)}
    .lobby.list .tiles{grid-template-columns:minmax(0,1fr)}
    .cats{justify-content:flex-start}
    .cats .lay{display:none}
  }
</style>
</head>
<body>
<div class="lobby">
  <p id="backRewards" hidden style="margin:0 0 14px"><a class="rw" href="https://www.buildpetals.com/rewards" target="_top">◀ Back to Petals Rewards</a></p>
  <h1>PETALS <span>ARCADE</span></h1>
  <div class="mhead"><b>PICK A GAME</b><span id="count"></span></div>
  <p class="sub">Pick a game. Every game has 10 levels.</p>
  <div class="cats" id="cats" role="group" aria-label="Game categories">
    <button data-v="all" aria-pressed="true">All games</button>
    <button data-v="popular" aria-pressed="false" hidden>🔥 Most played</button>
    <button data-v="puzzle" aria-pressed="false">🧩 Puzzle</button>
    <button data-v="reflex" aria-pressed="false">⚡ Quick reflexes</button>
    <button data-v="aim" aria-pressed="false">🎯 Aim &amp; bounce</button>
    <button data-v="memory" aria-pressed="false">🧠 Memory &amp; match</button>
    <button data-v="lb" aria-pressed="false" hidden>🏆 Leaderboards</button>
    <button class="lay" id="layBtn" aria-label="Switch between grid and list">☰ List</button>
  </div>
  <div class="tiles" id="tiles"></div>
  <p class="catEmpty" id="catEmpty" hidden></p>
  <div class="boards" id="boards" hidden>
    <section class="board"><h2>Whole Arcade · this month</h2><p class="bsub">Most levels cleared across every game</p><ol id="overallList"></ol></section>
    <section class="board"><h2><select id="gamePick" aria-label="Pick a game"></select></h2><p class="bsub">Best scores this month</p><ol id="gameList"></ol></section>
  </div>
  <p class="foot">New games added regularly · <a href="https://www.buildpetals.com" target="_top">buildpetals.com</a></p>
</div>
<script>
/* New games can bring their own lobby icon: paint(c) draws inside a 100 x 100 box with Arcade.softPaper helpers. */
const SPx = Arcade.softPaper;
const GAMES = [
  { slug: "wheelbarrow-jam", name: "Wheelbarrow Jam", sprite: "icon-wheelbarrow-jam", note: "Clear the jammed yard", isNew: true,
    paint(c) { [["#6f8ff5", 10, 12, 0], ["#ffc93c", 56, 30, 1], ["#f27aa3", 18, 58, 0]].forEach(([col, x, y, v]) => SPx.piece(c, SPx.rr(x, y, v ? 26 : 40, v ? 40 : 26, 8), col)); SPx.paint.rose(cx(c, 58, 66, 0.32)); c.restore(); } },
  { slug: "seed-volley", name: "Seed Volley", sprite: "icon-seed-volley", note: "Bounce seeds at weeds", isNew: true,
    paint(c) { [[8, 8, "#8fc77a"], [54, 8, "#6fb35f"], [30, 40, "#a6d48e"]].forEach(([x, y, col]) => SPx.piece(c, SPx.rr(x, y, 38, 30, 8), col)); c.fillStyle = "rgba(255,255,255,.95)"; [[50, 92], [56, 80], [62, 68], [68, 56]].forEach(([x, y]) => { c.beginPath(); c.arc(x, y, 3, 0, 7); c.fill(); }); SPx.piece(c, SPx.ell(46, 92, 7, 5), "#a9713f"); } },
  { slug: "petal-merge", name: "Petal Merge", sprite: "icon-petal-merge", note: "Grow by merging", isNew: true,
    paint(c) { [["#efe2cf", 8, 8], ["#e1f3d6", 52, 8], ["#fbe0ea", 8, 52], ["#fff6d6", 52, 52]].forEach(([col, x, y]) => SPx.piece(c, SPx.rr(x, y, 40, 40, 10), col)); SPx.paint.bud(cx(c, 52, 52)); c.restore(); SPx.piece(c, SPx.ell(28, 30, 9, 12, 0.5), "#a9713f"); SPx.piece(c, SPx.ell(72, 34, 12, 6, 0.5), "#6cc96a"); SPx.piece(c, SPx.circ(28, 72, 9), "#ffc93c"); } },
  { slug: "watering-pipes", name: "Watering Pipes", sprite: "icon-watering-pipes", note: "Water every flower", isNew: true,
    paint(c) { c.lineCap = "round"; [["rgba(40,30,70,.25)", 22], ["#4f8fe0", 16], ["#9fd3f5", 6]].forEach(([col, w]) => { c.strokeStyle = col; c.lineWidth = w; c.beginPath(); c.moveTo(20, 6); c.lineTo(20, 50); c.lineTo(70, 50); c.lineTo(70, 80); c.stroke(); }); SPx.paint.rose(cx(c, 48, 46, 0.5)); c.restore(); } },
  { slug: "petal-snake", name: "Petal Snake", sprite: "rose", note: "Grow the vine" },
  { slug: "petal-pairs", name: "Petal Pairs", sprite: "tulip", note: "Match the cards" },
  { slug: "whack-a-weed", name: "Whack-a-Weed", sprite: "weed", note: "Tap the weeds" },
  { slug: "bloom-stack", name: "Bloom Stack", sprite: "sunflower", note: "Stack the bricks" },
  { slug: "petal-catcher", name: "Petal Catcher", sprite: "daisy", note: "Catch the flowers" },
  { slug: "bee-line", name: "Bee Line", sprite: "bee", note: "Fly the gaps" },
  { slug: "bloom-breaker", name: "Bloom Breaker", sprite: "breaker", note: "Break the bricks" },
  { slug: "bouquet-blocks", name: "Bouquet Blocks", sprite: "bluebell", note: "Clear the rows" },
  { slug: "garden-match", name: "Garden Match", sprite: "phantom", note: "Match three" },
  { slug: "petal-pop", name: "Petal Pop", sprite: "poppy", note: "Pop the petals" },
  { slug: "bloom-echo", name: "Bloom Echo", sprite: "lily", note: "Repeat the pattern" },
  { slug: "vase-sort", name: "Vase Sort", sprite: "vase", note: "Sort the bouquets" },
  { slug: "lily-hop", name: "Lily Hop", sprite: "frog", note: "Cross the pond" },
  { slug: "seed-sling", name: "Seed Sling", sprite: "pot", note: "Plant the seeds" },
  { slug: "hedge-maze", name: "Hedge Maze", sprite: "hedge", note: "Find every seed" },
  { slug: "ladybug-leap", name: "Ladybug Leap", sprite: "ladybug", note: "Bounce up high" },
  { slug: "pollen-path", name: "Pollen Path", sprite: "hive", note: "Visit every flower" },
  { slug: "mow-lane", name: "Mow Lane", sprite: "mower", note: "Mow every patch" },
  { slug: "bud-timing", name: "Bud Timing", sprite: "bud", note: "Tap at full bloom" },
  { slug: "garden-guard", name: "Garden Guard", sprite: "snail", note: "Stop the pests" },
];
/* draw a stock piece into part of an icon: shifts and scales the 100 x 100 box (call c.restore() after) */
function cx(c, x, y, k) { c.save(); c.translate(x, y); c.scale(k || 0.4, k || 0.4); return c; }
for (const g of GAMES) if (g.paint) SPx.paint[g.sprite] = g.paint;
/* Lobby categories. Add each new game's slug to one list; a game missing here still shows under All games. */
const CATEGORIES = {
  puzzle: ["wheelbarrow-jam", "petal-merge", "watering-pipes", "petal-words", "vase-sort", "hedge-maze", "pollen-path", "mow-lane", "bouquet-blocks"],
  reflex: ["florist-rush", "compost-sort", "whack-a-weed", "petal-catcher", "bee-line", "lily-hop", "ladybug-leap", "bud-timing", "garden-guard", "petal-snake", "bloom-stack"],
  aim: ["seed-volley", "seed-drop", "bloom-breaker", "petal-pop", "seed-sling"],
  memory: ["petal-pairs", "bloom-echo", "garden-match"],
};
const MOST_PLAYED = 8; // how many games the Most played category lists
const tiles = document.getElementById("tiles");
for (const g of GAMES) {
  const el = document.createElement(g.slug ? "a" : "div");
  el.className = "tile" + (g.slug ? "" : " soon");
  if (g.slug) { el.href = g.slug + "/"; el.target = "_self"; }
  const ic = document.createElement("span"); ic.className = "ic"; ic.appendChild(Arcade.thumb(g.sprite, 48)); el.appendChild(ic);
  el.insertAdjacentHTML("beforeend", `<span class="txt"><b>${g.name}</b><small>${g.note}</small></span>`);
  if (g.slug) {
    const lvl = Arcade.store.get("bp_" + g.slug + "_bestlvl", 0);
    if (lvl) el.insertAdjacentHTML("beforeend", `<span class="tag">${lvl}/10</span>`);
    else if (g.isNew) el.insertAdjacentHTML("beforeend", `<span class="tag new">New</span>`);
    el.insertAdjacentHTML("beforeend", `<span class="play" aria-hidden="true"><svg width="14" height="16" viewBox="0 0 14 16"><polygon points="2,1 13,8 2,15" fill="#fff6e5"/></svg></span>`);
    el.setAttribute("aria-label", "Play " + g.name);
  }
  tiles.appendChild(el);
}
// Opened on its own (not inside buildpetals.com): offer a clear way back to the rewards page.
if (window.top === window) document.getElementById("backRewards").hidden = false;
// Monthly saved progress for members, sent by the Build Petals page: level badges and cleared games.
window.addEventListener("message", (e) => {
  const m = e.data;
  if (!m || m.source !== "buildpetals-site" || m.type !== "progress" || !m.enabled || !m.games) return;
  for (const el of tiles.querySelectorAll("a.tile")) {
    const slug = el.getAttribute("href").replace("/", "");
    const lvl = Math.max(0, Number(m.games[slug]) || 0);
    el.querySelectorAll(lvl > 0 ? ".tag" : ".tag:not(.new)").forEach((t) => t.remove());
    el.classList.toggle("done", lvl >= 10);
    if (lvl >= 10) {
      el.querySelector("small").textContent = "Cleared · back " + (m.resetLabel || "next month");
      el.setAttribute("aria-disabled", "true");
      el.onclick = (ev) => ev.preventDefault();
    } else if (lvl > 0) {
      const play = el.querySelector(".play");
      play.insertAdjacentHTML("beforebegin", `<span class="tag">Lv ${lvl}/10</span>`);
    }
  }
});
// Categories are always on. Most played + leaderboards need the stats message from the Build Petals page:
// { type: "stats", plays: { slug: n }, overall: [{ name, levels, score, me }], boards: { slug: [{ name, score, levels, me }] } }
// Play counts only decide which games are in Most played and their order; the numbers are never shown.
let stats = null, view = "all";
try { view = sessionStorage.getItem("bp_arcade_cat") || "all"; } catch (e) {}
const order = GAMES.filter((g) => g.slug).map((g) => g.slug);
const catBtns = [...document.querySelectorAll("#cats button[data-v]")];
const catEmpty = document.getElementById("catEmpty");
function fillList(ol, rows, value) {
  ol.textContent = "";
  if (!rows || !rows.length) { const li = document.createElement("li"); li.className = "empty"; li.textContent = "No scores yet this month. Be the first!"; ol.appendChild(li); return; }
  rows.slice(0, 10).forEach((r, i) => {
    const li = document.createElement("li"); if (r.me) li.className = "me";
    [["n", i < 3 ? ["🥇", "🥈", "🥉"][i] : String(i + 1)], ["who", String(r.name || "Gardener")], ["v", value(r)]].forEach(([c, t]) => { const sp = document.createElement("span"); sp.className = c; sp.textContent = t; li.appendChild(sp); });
    ol.appendChild(li);
  });
}
function showGameBoard() { const slug = document.getElementById("gamePick").value; fillList(document.getElementById("gameList"), stats && stats.boards && stats.boards[slug], (r) => (Number(r.score) || 0).toLocaleString()); }
function setView(v) {
  const btn = catBtns.find((b) => b.dataset.v === v);
  if (!btn || btn.hidden) v = "all";
  view = v;
  try { sessionStorage.setItem("bp_arcade_cat", v); } catch (e) {}
  catBtns.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === v)));
  tiles.hidden = v === "lb"; document.getElementById("boards").hidden = v !== "lb";
  const els = [...tiles.querySelectorAll("a.tile")], plays = (stats && stats.plays) || {};
  const slugOf = (el) => el.getAttribute("href").replace("/", "");
  let shown;
  if (v === "popular") {
    shown = order.filter((g) => (Number(plays[g]) || 0) > 0).sort((a, b) => plays[b] - plays[a] || order.indexOf(a) - order.indexOf(b)).slice(0, MOST_PLAYED);
  } else shown = v === "all" || v === "lb" ? order : order.filter((g) => (CATEGORIES[v] || []).includes(g));
  els.sort((a, b) => (shown.indexOf(slugOf(a)) + 1 || 999) - (shown.indexOf(slugOf(b)) + 1 || 999) || order.indexOf(slugOf(a)) - order.indexOf(slugOf(b)))
    .forEach((el) => { el.hidden = !shown.includes(slugOf(el)); tiles.appendChild(el); });
  catEmpty.hidden = v === "lb" || shown.length > 0;
  catEmpty.textContent = v === "popular" ? "No games played yet this month. Pick one and start the list!" : "No games here yet. More are on the way!";
  document.getElementById("count").textContent = v === "lb" ? "" : shown.length + (shown.length === 1 ? " game" : " games");
  reportLobbyHeight();
}
catBtns.forEach((b) => (b.onclick = () => setView(b.dataset.v)));
// Grid or list layout on wider screens (phones always use the list), remembered on this device.
const lobbyEl = document.querySelector(".lobby"), layBtn = document.getElementById("layBtn");
function setLayout(list) {
  lobbyEl.classList.toggle("list", list);
  layBtn.textContent = list ? "▦ Grid" : "☰ List";
  try { localStorage.setItem("bp_arcade_layout", list ? "list" : "grid"); } catch (e) {}
  reportLobbyHeight();
}
layBtn.onclick = () => setLayout(!lobbyEl.classList.contains("list"));
const pick = document.getElementById("gamePick");
GAMES.filter((g) => g.slug).forEach((g) => { const o = document.createElement("option"); o.value = g.slug; o.textContent = g.name; pick.appendChild(o); });
pick.onchange = showGameBoard;
window.addEventListener("message", (e) => {
  const m = e.data;
  if (!m || m.source !== "buildpetals-site" || m.type !== "stats") return;
  stats = m;
  catBtns.forEach((b) => { if (b.dataset.v === "popular" || b.dataset.v === "lb") b.hidden = false; });
  fillList(document.getElementById("overallList"), m.overall, (r) => `${Number(r.levels) || 0} lv · ${(Number(r.score) || 0).toLocaleString()}`);
  showGameBoard(); setView(view);
});
// Tell the Build Petals page how tall the game list is, so the Arcade box fits it.
function reportLobbyHeight() {
  try {
    const lobby = document.querySelector(".lobby");
    const h = Math.ceil(lobby.getBoundingClientRect().bottom + window.scrollY) + 8;
    window.parent.postMessage({ source: "buildpetals-arcade", type: "lobby", height: h }, "*");
  } catch (e) {}
}
let savedLayout = "grid"; try { savedLayout = localStorage.getItem("bp_arcade_layout") || "grid"; } catch (e) {}
setLayout(savedLayout === "list");
setView(view);
window.addEventListener("load", reportLobbyHeight);
// Ask the Build Petals page for most-played counts and leaderboards (see wix/README.md).
try { window.parent.postMessage({ source: "buildpetals-arcade", type: "lobbyReady" }, "*"); } catch (e) {}
if (window.ResizeObserver) new ResizeObserver(reportLobbyHeight).observe(document.querySelector(".lobby"));
</script>
</body>
</html>

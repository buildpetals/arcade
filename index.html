<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Petals Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;min-height:100vh;background:#101a42;color:#fff6e5;font-family:Fredoka,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;box-sizing:border-box;
    background-image:linear-gradient(rgba(143,199,255,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(143,199,255,.1) 1px,transparent 1px);background-size:24px 24px}
  h1{margin:0;font-size:36px}h1 span{color:#b9a7f5}
  a.game{display:block;background:#fff6e5;color:#101a42;text-decoration:none;border-radius:16px;padding:16px 22px;font-size:22px;font-weight:700;box-shadow:0 5px 0 #8f7ae6;min-width:240px;text-align:center}
  small{opacity:.7}
</style>
</head>
<body>
  <h1>Build Petals <span>Arcade</span></h1>
  <a class="game" href="petal-snake/">🌸 Petal Snake</a>
  <small>More flower games coming soon · <a href="https://www.buildpetals.com" style="color:#8fc7ff" target="_top">buildpetals.com</a></small>
</body>
</html>

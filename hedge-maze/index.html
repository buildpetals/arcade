<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hedge Maze · Build Petals Arcade</title>
<script src="../kit/arcade-kit.js"></script>
</head>
<body>
<script>
/* HEDGE MAZE — guide the ladybug through the garden maze and collect every seed before time runs out. */
const W = 360, H = 480;
const GOAL = [4, 5, 6, 6, 7, 8, 8, 9, 10, 10];
const SIZES = [[5, 7], [6, 8], [6, 8], [7, 9], [7, 9], [8, 10], [8, 11], [9, 12], [9, 12], [10, 13]];
const L = (lv, a, b) => Arcade.lerpLevel(lv, a, b);
let cols, rows, C, ox, oy, walls, bug, seeds, beetles, timeLeft, fx;

function makeMaze() {
  // walls[r][c] = [top, right, bottom, left]; recursive backtracker, then knock out a few extra walls for loops
  walls = Array.from({ length: rows }, () => Array.from({ length: cols }, () => [1, 1, 1, 1]));
  const seen = Array.from({ length: rows }, () => Array(cols).fill(false)), st = [[0, 0]]; seen[0][0] = true;
  const D = [[-1, 0, 0, 2], [0, 1, 1, 3], [1, 0, 2, 0], [0, -1, 3, 1]];
  while (st.length) {
    const [r, c] = st[st.length - 1];
    const opts = D.filter(([dr, dc]) => { const a = r + dr, b = c + dc; return a >= 0 && a < rows && b >= 0 && b < cols && !seen[a][b]; });
    if (!opts.length) { st.pop(); continue; }
    const [dr, dc, w, o] = Arcade.pick(opts), a = r + dr, b = c + dc;
    walls[r][c][w] = 0; walls[a][b][o] = 0; seen[a][b] = true; st.push([a, b]);
  }
  const extra = Math.round(cols * rows * 0.08);
  for (let i = 0; i < extra; i++) {
    const r = Math.floor(Math.random() * rows), c = Math.floor(Math.random() * (cols - 1));
    walls[r][c][1] = 0; walls[r][c + 1][3] = 0;
  }
}
const open = (r, c, d) => !walls[r][c][d];
const DIRS = { up: [0, -1, 0], right: [1, 0, 1], down: [0, 1, 2], left: [-1, 0, 3] };
const exits = (r, c) => Object.keys(DIRS).filter((k) => open(r, c, DIRS[k][2]));

function moverStep(m, dt, speed) {
  // m: {r,c,px,py (progress 0..1 toward target), dir, next}
  if (!m.dir) return;
  m.p += speed * dt;
  if (m.p >= 1) {
    m.c += DIRS[m.dir][0]; m.r += DIRS[m.dir][1]; m.p = 0;
    return true; // arrived in a new cell
  }
}
function cellXY(m) {
  const d = m.dir ? DIRS[m.dir] : [0, 0];
  return [ox + (m.c + 0.5 + d[0] * m.p) * C, oy + (m.r + 0.5 + d[1] * m.p) * C];
}
function bugArrive(kit) {
  const i = seeds.findIndex((s) => s.r === bug.r && s.c === bug.c);
  if (i >= 0) { seeds.splice(i, 1); kit.add(20); const [x, y] = cellXY(bug); fx.push({ x, y: y - 10, t: kit.now, txt: "+20", c: "#ffd166" }); kit.collect(); }
  // turn into the queued direction if possible, keep going straight otherwise, stop at walls and junctions
  if (bug.next && open(bug.r, bug.c, DIRS[bug.next][2])) { bug.dir = bug.next; bug.next = null; return; }
  if (!open(bug.r, bug.c, DIRS[bug.dir][2])) { bug.dir = null; return; }
  if (exits(bug.r, bug.c).length > 2) bug.dir = null;
}
function steer(d) {
  if (!bug.dir) { if (open(bug.r, bug.c, DIRS[d][2])) bug.dir = d; else bug.next = d; return; }
  const rev = { up: "down", down: "up", left: "right", right: "left" };
  if (d === rev[bug.dir]) { // turn around mid-corridor
    bug.c += DIRS[bug.dir][0]; bug.r += DIRS[bug.dir][1]; bug.p = 1 - bug.p; bug.dir = d; bug.next = null; return;
  }
  bug.next = d;
}

Arcade.run({
  id: "hedge-maze",
  title: ["HEDGE", "MAZE"],
  blurb: "Guide the ladybug through the garden maze and pick up every <b>seed</b> before the clock runs out. From level 5, watch out for wandering beetles! Clear all <b>10 levels</b>.",
  hint: "Phones: swipe anywhere to turn · Arrow keys / WASD · Space to pause",
  legend: [{ sprite: "ladybug", label: "you" }, { sprite: "sunflower", label: "seeds +20" }, { sprite: "bug", label: "avoid" }],
  width: W, height: H, lives: 3, dpad: false, swipeAnywhere: true, swipeStep: 18,
  goal: (l) => GOAL[l - 1],
  goalLabel: (l) => `collect ${GOAL[l - 1]} seeds${l === 5 ? " · beetles!" : ""}`,
  setup(level, kit) {
    [cols, rows] = SIZES[level - 1];
    C = Math.floor(Math.min((W - 16) / cols, (H - 50) / rows)); ox = Math.floor((W - cols * C) / 2); oy = 40 + Math.floor((H - 44 - rows * C) / 2);
    makeMaze();
    bug = { r: 0, c: 0, p: 0, dir: null, next: null };
    seeds = [];
    const n = GOAL[level - 1];
    while (seeds.length < n) {
      const r = Math.floor(Math.random() * rows), c = Math.floor(Math.random() * cols);
      if (r + c < 3 || seeds.some((s) => s.r === r && s.c === c)) continue;
      seeds.push({ r, c });
    }
    beetles = [];
    const nb = level >= 5 ? Math.round(L(level, 1, 3)) : 0;
    for (let i = 0; i < nb; i++) beetles.push({ r: rows - 1 - i, c: cols - 1, p: 0, dir: null });
    timeLeft = Math.round(n * L(level, 9, 7) + cols * rows * 0.25);
    fx = [];
  },
  update(dt, kit) {
    timeLeft -= dt;
    kit.setInfo(`<b style="color:#ff8fc2">${"♥".repeat(Math.max(0, kit.lives))}</b> ⏱ <b>${Math.max(0, Math.ceil(timeLeft))}</b>`);
    if (timeLeft <= 0) { kit.toast("Out of time!"); kit.fail(); return; }
    if (moverStep(bug, dt, L(kit.level, 6, 8))) bugArrive(kit);
    for (const b of beetles) {
      if (!b.dir || moverStep(b, dt, L(kit.level, 2.4, 3.6))) {
        const rev = { up: "down", down: "up", left: "right", right: "left" };
        let ex = exits(b.r, b.c); if (ex.length > 1 && b.dir) ex = ex.filter((d) => d !== rev[b.dir]);
        b.dir = Arcade.pick(ex);
      }
      const [bx, by] = cellXY(b), [lx, ly] = cellXY(bug);
      if (Math.hypot(bx - lx, by - ly) < C * 0.6) {
        fx.push({ x: lx, y: ly - 10, t: kit.now, txt: "ouch!", c: "#ff8fc2" });
        kit.loseLife(); bug = { r: 0, c: 0, p: 0, dir: null, next: null };
        for (const o of beetles) { o.r = rows - 1; o.c = cols - 1; o.p = 0; o.dir = null; }
        break;
      }
    }
    fx = fx.filter((f) => kit.now - f.t < 700);
  },
  swipe(d) { steer(d); },
  key(k) {
    const m = { ArrowUp: "up", w: "up", W: "up", ArrowDown: "down", s: "down", S: "down", ArrowLeft: "left", a: "left", A: "left", ArrowRight: "right", d: "right", D: "right" }[k];
    if (m) { steer(m); return true; }
    return false;
  },
  pointerDown(x, y) {
    const [bx, by] = cellXY(bug), dx = x - bx, dy = y - by;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < C * 0.5) return;
    steer(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
  },
  draw(ctx, kit) {
    Arcade.grid(ctx, W, H, 24);
    ctx.fillStyle = "rgba(255,246,229,.35)"; ctx.fillRect(ox, oy, cols * C, rows * C);
    const t = Math.max(3, Math.round(C * 0.18));
    ctx.fillStyle = "#2b8a44";
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const x = ox + c * C, y = oy + r * C, w = walls[r][c];
      if (w[0]) ctx.fillRect(x - t / 2, y - t / 2, C + t, t);
      if (w[3]) ctx.fillRect(x - t / 2, y - t / 2, t, C + t);
      if (r === rows - 1 && w[2]) ctx.fillRect(x - t / 2, y + C - t / 2, C + t, t);
      if (c === cols - 1 && w[1]) ctx.fillRect(x + C - t / 2, y - t / 2, t, C + t);
    }
    const s = C * 0.62;
    for (const sd of seeds) Arcade.drawSprite(ctx, "sunflower", ox + (sd.c + 0.5) * C - s / 2, oy + (sd.r + 0.5) * C - s / 2, s);
    for (const b of beetles) { const [x, y] = cellXY(b); Arcade.drawSprite(ctx, "bug", x - s / 2, y - s / 2, s); }
    const [lx, ly] = cellXY(bug); Arcade.drawSprite(ctx, "ladybug", lx - s * 0.6, ly - s * 0.6, s * 1.2);
    ctx.textAlign = "center"; ctx.font = '9px "Press Start 2P", monospace'; ctx.fillStyle = "#fff6e5"; Arcade.ink(ctx);
    const tl = `TIME ${Math.max(0, Math.ceil(timeLeft))}`; ctx.strokeText(tl, W / 2, 24); ctx.fillText(tl, W / 2, 24);
    ctx.font = '10px "Press Start 2P", monospace';
    for (const f of fx) { const k = (kit.now - f.t) / 700; ctx.globalAlpha = 1 - k; ctx.fillStyle = f.c; Arcade.ink(ctx); ctx.strokeText(f.txt, f.x, f.y - k * 16); ctx.fillText(f.txt, f.x, f.y - k * 16); }
    ctx.globalAlpha = 1;
  },
});
</script>
</body>
</html>
